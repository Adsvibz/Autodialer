name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          unzip -q -o AutoDialerPro*.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDialerPro-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
