name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AutoDialerPro.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
        working-directory: AutoDialerPro
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDialerPro-APK
          path: AutoDialerPro/app/build/outputs/apk/debug/app-debug.apk
